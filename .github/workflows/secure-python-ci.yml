name: Python CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        fetch-depth: 0

    - name: Set up Python environment
      uses: actions/setup-python@0b93645e9fbca3061306a771c91aa8929e5a3297
      with:
        python-version: '3.11'

    - name: Cache Python dependencies
      uses: actions/cache@d930a84f245250243f350da006b586040a4c40b1
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        else
          echo "No requirements.txt found. Skipping dependency installation."
        fi
      continue-on-error: true

    - name: Run tests
      run: |
        pip install pytest
        if find . -name "test_*.py" -o -name "*_test.py" | grep -q .; then
          pytest
        else
          echo "No unit tests found, skipping test execution."
        fi
      continue-on-error: true

    - name: Run Gitleaks scan
      uses: gitleaks/gitleaks-action@30b4fbc2363dbb28d21c9024f8488b7dc37e0e7a
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Run Semgrep scan
      uses: semgrep/semgrep-action@713e2d6b38c2634e320f719460d0066f108d8102
      with:
        config: auto
      continue-on-error: true
